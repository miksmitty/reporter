<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Key Topics Reporting</title>
  <script src="theme.js?v=20261001b"></script>
  <link rel="stylesheet" href="styles.css?v=20261001b" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <button type="button" class="brand" id="btn-home" aria-label="Key Topics Reporting — overview">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Key Topics<br />Reporting</span>
      </button>
      <nav class="nav" aria-label="Sections">
        <a class="nav-item" href="#overview" data-nav="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Overview</span>
        </a>
        <a class="nav-item" href="#topics" data-nav="topics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
          <span>Topics</span>
        </a>
        <a class="nav-item" href="#weekly" data-nav="weekly">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          <span>Weekly pack</span>
        </a>
      </nav>
      <button type="button" class="btn btn-primary sidebar-cta" id="btn-new-topic">+ New topic</button>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <main class="main" id="app">
      <!-- views rendered by app.js -->
    </main>
  </div>

  <div class="toast-host" id="toast-host" aria-live="polite"></div>

  <script src="png.js?v=20261001b" defer></script>
  <script src="app.js?v=20261001b" defer></script>
</body>
</html>
